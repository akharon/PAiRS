name: CI

on:
  push:
    branches: [main, master]
  pull_request:
    branches: [main, master]

jobs:
  test:
    runs-on: ${{ matrix.os }}
    strategy:
      matrix:
        os: [ubuntu-latest, macos-latest, windows-latest]
        node-version: [22]
    steps:
      - uses: actions/checkout@v4

      - name: Setup Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Fetch grammars
        run: npm run fetch-grammars

      - name: Typecheck
        run: npm run typecheck

      - name: Lint
        run: npm run lint

      - name: Test
        run: npm run test

      - name: Build
        run: npm run build

      - name: Smoke index (ARES)
        if: always()
        run: |
          # If .gizem already exists from a prior test, clean it
          rm -rf .gizem
          # Run a quick index on the current repo (acts as smoke test)
          node dist/cli.js index 2>&1 | head -20
          # Verify .gizem was created
          test -d .gizem && echo "✓ .gizem directory created" || (echo "✗ .gizem directory not found" && exit 1)
        shell: bash
